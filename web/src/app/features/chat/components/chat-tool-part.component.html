<details class="chat-part chat-part--tool" [open]="part().phase === 'call'">
  <summary class="chat-part__tool-summary">
    <mat-icon>{{ part().phase === 'call' ? 'build' : 'check_circle' }}</mat-icon>
    <span class="chat-part__tool-title">{{ part().title || part().name }}</span>
    <span class="chat-part__tool-phase">{{ part().phase === 'call' ? '调用中' : '已完成' }}</span>
  </summary>
  @if (part().input) {
    <pre class="chat-part__tool-block"><code>{{ part().input | json }}</code></pre>
  }
  @if (part().output !== undefined && part().output !== null) {
    <pre class="chat-part__tool-block"><code>{{ part().output | json }}</code></pre>
  }
</details>
